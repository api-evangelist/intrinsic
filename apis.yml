name: Intrinsic
description: >-
  Intrinsic is a unified Trust & Safety platform that gives safety teams a single
  API and dashboard to detect, investigate, and enforce against abuse across
  user- and AI-generated content, fraud, and marketplace abuse. The platform
  surfaces machine-learning classifiers (for example text toxicity and IP trust
  scoring), account graph lineage for linkage analysis, geo enrichers, and global
  intelligence signals through a synchronous API, and lets teams author, version,
  deploy, and monitor real-time anti-abuse rules from a hosted dashboard. Founded
  in 2022 in San Francisco by Karine Mellata and Michael Lin (previously on Trust
  & Safety ML and data-engineering infrastructure at Apple and Discord), Intrinsic
  has since rebranded to Variance (variance.co); the Intrinsic-branded developer
  surfaces at docs.intrinsicapi.com and api.intrinsicapi.com remain in service.
